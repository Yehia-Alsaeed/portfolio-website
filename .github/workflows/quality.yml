name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Check Drizzle migration consistency
        run: pnpm db:check
        env:
          DATABASE_URL_UNPOOLED: postgres://ci:ci@localhost:5432/ci

      - name: Build production application
        run: pnpm build
        env:
          # `next start -p 3100` is what serves this build for both the browser
          # tests and the Lighthouse gate, so metadataBase has to agree with
          # that port. Without this, `NEXT_PUBLIC_SITE_URL` is unset, the
          # validated fallback in src/lib/env/public.ts resolves to port 3000,
          # and absolute metadata URLs (og:image in particular) point at a port
          # nothing is listening on. `next dev` masks this by rewriting
          # metadata image URLs to the live request origin, which is why it
          # only ever surfaced against a production build.
          NEXT_PUBLIC_SITE_URL: http://localhost:3100

      - name: Install browsers
        # Must cover every engine declared in playwright.config.ts's projects
        # (chromium, firefox, webkit - the webkit-iphone project reuses the
        # same webkit build), or those projects fail at launch rather than
        # being skipped.
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        run: pnpm playwright test

      - name: Run Lighthouse baseline gate
        run: pnpm lighthouse
